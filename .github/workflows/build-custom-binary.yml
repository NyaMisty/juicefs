name: "build-custom-binary"

on:
  push:
    branches:
      - 'sync-queue-size'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Build
        run: |
          make juicefs
          ./juicefs version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: juicefs-v1.4.2-queue-size-linux-amd64
          path: juicefs
          retention-days: 7
